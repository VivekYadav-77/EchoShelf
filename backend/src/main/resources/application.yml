spring:
  application:
    name: backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/musiclibrary}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:shivamyadav}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:8a4a754117b3a033c99f0e1f6e21019f85c13652c7e034e3234559c55b184293} # Default is a 256-bit hex string for dev
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

echoshelf:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

gemini:
  api-key: "REDACTED"

logging:
  level:
    root: INFO
    com.echoshelf: DEBUG
    org.springframework.security: DEBUG
